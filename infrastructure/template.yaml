AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Fintech Serverless Loan Lending Platform

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        DYNAMODB_TABLE_NAME: !Ref FintechTransactionsTable
        CACHE_TABLE_NAME: !Ref FintechCacheTable
        SQS_QUEUE_URL: !Ref FintechTransactionQueue
        FUNCTION_NAME: !Sub fintech-api-${Environment}
        APP_VERSION: "1.0.0"

Resources:

  # -------------------------------------------------------
  # SQS FIFO Dead Letter Queue
  # -------------------------------------------------------
  FintechTransactionDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub fintech-transactions-dlq-${Environment}.fifo
      FifoQueue: true
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: Project
          Value: fintech-serverless
        - Key: Environment
          Value: !Ref Environment

  # -------------------------------------------------------
  # SQS FIFO Queue
  # -------------------------------------------------------
  FintechTransactionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub fintech-transactions-${Environment}.fifo
      FifoQueue: true
      ContentBasedDeduplication: false
      VisibilityTimeout: 60
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt FintechTransactionDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Project
          Value: fintech-serverless
        - Key: Environment
          Value: !Ref Environment

  # -------------------------------------------------------
  # Lambda Layers
  # -------------------------------------------------------
  FintechDependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub fintech-dependencies-${Environment}
      Description: Shared dependencies for fintech Lambda functions
      ContentUri: ../package/
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Delete

  # -------------------------------------------------------
  # IAM Role — shared across Lambda functions
  # -------------------------------------------------------
  FintechLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub fintech-lambda-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: FintechLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # DynamoDB — scoped to fintech tables only
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:DescribeTable
                  - dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt FintechTransactionsTable.Arn
                  - !Sub ${FintechTransactionsTable.Arn}/index/*
                  - !GetAtt FintechCacheTable.Arn
              # SQS — scoped to fintech queue only
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt FintechTransactionQueue.Arn
              # Secrets Manager — scoped to fintech secrets only
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource: !Sub arn:aws:secretsmanager:us-east-1:${AWS::AccountId}:secret:/fintech/*
              # KMS — for decrypting secrets
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: '*'
              # CodeDeploy — for lifecycle hooks
              - Effect: Allow
                Action:
                  - codedeploy:PutLifecycleEventHookExecutionStatus
                Resource: '*'
              # CloudWatch — for AfterAllowTraffic hook metrics
              - Effect: Allow
                Action:
                  - cloudwatch:GetMetricStatistics
                Resource: '*'

  # -------------------------------------------------------
  # CodeDeploy Service Role
  # -------------------------------------------------------
  FintechCodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub fintech-codedeploy-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSCodeDeployRoleForLambda
      Policies:
        - PolicyName: CodeDeployLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:UpdateAlias
                  - lambda:ListVersionsByFunction
                  - lambda:InvokeFunction
                  - lambda:GetAlias
                  - lambda:UpdateFunctionCode
                  - lambda:PublishVersion
                  - codedeploy:*
                  - cloudwatch:DescribeAlarms
                  - sns:Publish
                  - iam:PassRole
                Resource: '*'

  # -------------------------------------------------------
  # Lambda — API Function
  # -------------------------------------------------------
  FintechApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub fintech-api-${Environment}
      Description: "FastAPI + Mangum handler for loan application endpoints"
      CodeUri: ../package/
      Handler: src.api.main.handler
      Role: !GetAtt FintechLambdaRole.Arn
      Tracing: Active
      AutoPublishAlias: !Ref Environment
      DeploymentPreference:
        Type: Canary10Percent15Minutes
        Role: !GetAtt FintechCodeDeployServiceRole.Arn
        Hooks:
          PreTraffic: !Ref FintechValidateDeploymentFunction
          PostTraffic: !Ref FintechValidateProductionFunction
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref FintechApi
            Path: /{proxy+}
            Method: ANY
        HealthEvent:
          Type: Api
          Properties:
            RestApiId: !Ref FintechApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE

  # -------------------------------------------------------
  # Lambda — Authorizer Function
  # -------------------------------------------------------
  FintechAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub fintech-authorizer-${Environment}
      Description: "Lambda Authorizer — JWT validation before main function invokes"
      CodeUri: ../package/
      Handler: src.authorizer.handler.handler
      Role: !GetAtt FintechLambdaRole.Arn
      Tracing: Active

  # -------------------------------------------------------
  # Lambda — SQS Worker Function
  # -------------------------------------------------------
  FintechWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub fintech-worker-${Environment}
      Description: "SQS FIFO worker — processes loan transactions asynchronously"
      CodeUri: ../package/
      Handler: src.worker.handler.handler
      Role: !GetAtt FintechLambdaRole.Arn
      Tracing: Active
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt FintechTransactionQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

  # -------------------------------------------------------
  # Lambda — BeforeAllowTraffic Hook
  # -------------------------------------------------------
  FintechValidateDeploymentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub fintech-validate-deployment-${Environment}
      Description: "CodeDeploy BeforeAllowTraffic hook — pre-deployment sanity check"
      CodeUri: ../package/
      Handler: src.hooks.validate_deployment.handler
      Role: !GetAtt FintechLambdaRole.Arn
      Tracing: Active

  # -------------------------------------------------------
  # Lambda — AfterAllowTraffic Hook
  # -------------------------------------------------------
  FintechValidateProductionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub fintech-validate-production-${Environment}
      Description: "CodeDeploy AfterAllowTraffic hook — canary window error monitoring"
      CodeUri: ../package/
      Handler: src.hooks.validate_production.handler
      Role: !GetAtt FintechLambdaRole.Arn
      Tracing: Active

  # -------------------------------------------------------
  # Lambda Permission — allow CodeDeploy to invoke hooks
  # -------------------------------------------------------
  ValidateDeploymentPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt FintechValidateDeploymentFunction.Arn
      Action: lambda:InvokeFunction
      Principal: codedeploy.amazonaws.com
      SourceArn: !Sub arn:aws:codedeploy:us-east-1:${AWS::AccountId}:deploymentgroup:*

  ValidateProductionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt FintechValidateProductionFunction.Arn
      Action: lambda:InvokeFunction
      Principal: codedeploy.amazonaws.com
      SourceArn: !Sub arn:aws:codedeploy:us-east-1:${AWS::AccountId}:deploymentgroup:*

  # -------------------------------------------------------
  # API Gateway
  # -------------------------------------------------------
  FintechApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub fintech-api-${Environment}
      StageName: !Ref Environment
      TracingEnabled: true
      Auth:
        DefaultAuthorizer: FintechAuthorizer
        Authorizers:
          FintechAuthorizer:
            FunctionArn: !GetAtt FintechAuthorizerFunction.Arn
            Identity:
              Header: Authorization
        ResourcePolicy:
          CustomStatements:
            - Effect: Allow
              Principal: '*'
              Action: execute-api:Invoke
              Resource: !Sub arn:aws:execute-api:us-east-1:${AWS::AccountId}:*/${Environment}/GET/health
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingBurstLimit: 100
          ThrottlingRateLimit: 50
          LoggingLevel: INFO
          DataTraceEnabled: false
          MetricsEnabled: true

  # -------------------------------------------------------
  # DynamoDB — Main Transactions Table
  # -------------------------------------------------------
  FintechTransactionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub fintech-transactions-${Environment}
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      AttributeDefinitions:
        - AttributeName: account_id
          AttributeType: S
        - AttributeName: timestamp_transaction_id
          AttributeType: S
        - AttributeName: transaction_id
          AttributeType: S
        - AttributeName: customer_id
          AttributeType: S
      KeySchema:
        - AttributeName: account_id
          KeyType: HASH
        - AttributeName: timestamp_transaction_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: transaction-id-index
          KeySchema:
            - AttributeName: transaction_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: customer-id-index
          KeySchema:
            - AttributeName: customer_id
              KeyType: HASH
            - AttributeName: timestamp_transaction_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      Tags:
        - Key: Project
          Value: fintech-serverless
        - Key: Environment
          Value: !Ref Environment

  # -------------------------------------------------------
  # DynamoDB — Cache Table
  # -------------------------------------------------------
  FintechCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub fintech-cache-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cache_key
          AttributeType: S
      KeySchema:
        - AttributeName: cache_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      Tags:
        - Key: Project
          Value: fintech-serverless
        - Key: Environment
          Value: !Ref Environment

  # -------------------------------------------------------
  # CloudWatch — Billing Alarm
  # -------------------------------------------------------
  BillingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub fintech-billing-alarm-${Environment}
      AlarmDescription: Alert when AWS charges exceed $10
      MetricName: EstimatedCharges
      Namespace: AWS/Billing
      Statistic: Maximum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: Currency
          Value: USD

Outputs:
  ApiUrl:
    Value: !Sub https://${FintechApi}.execute-api.us-east-1.amazonaws.com/${Environment}
    Export:
      Name: !Sub fintech-api-url-${Environment}

  ApiId:
    Value: !Ref FintechApi
    Export:
      Name: !Sub fintech-api-id-${Environment}

  TransactionsTableName:
    Value: !Ref FintechTransactionsTable
    Export:
      Name: !Sub fintech-transactions-table-${Environment}

  TransactionsTableArn:
    Value: !GetAtt FintechTransactionsTable.Arn
    Export:
      Name: !Sub fintech-transactions-table-arn-${Environment}

  CacheTableName:
    Value: !Ref FintechCacheTable
    Export:
      Name: !Sub fintech-cache-table-${Environment}

  WorkerFunctionArn:
    Value: !GetAtt FintechWorkerFunction.Arn
    Export:
      Name: !Sub fintech-worker-arn-${Environment}

  QueueUrl:
    Value: !Ref FintechTransactionQueue
    Export:
      Name: !Sub fintech-queue-url-${Environment}

  DLQUrl:
    Value: !Ref FintechTransactionDLQ
    Export:
      Name: !Sub fintech-dlq-url-${Environment}

  DLQArn:
    Value: !GetAtt FintechTransactionDLQ.Arn
    Export:
      Name: !Sub fintech-dlq-arn-${Environment}