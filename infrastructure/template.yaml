AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Fintech Serverless Loan Lending Platform

Parameters:
  Environment:
    Type: String
    # Default: dev
    AllowedValues: [dev, staging, prod]

  AppVersionPrefix:
    Type: String
    Default: "1.0"
    Description: "Manually-bumped semver prefix — update deliberately for significant changes"

  EnableCloudFront:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: "Set to true only once AWS has cleared CloudFront account verification"

  RegionalCustomDomainCertArn:
    Type: String
    Default: ""
    Description: "ACM cert ARN (us-east-1) for the API Gateway Regional custom domain — reuses the existing validated cert"

  JwtKmsKeyArn:
    Type: String
    Description: "ARN of the CMK protecting the JWT secret"

  EncryptionKmsKeyArn:
    Type: String
    Description: "ARN of the CMK protecting the AES-256-GCM encryption key"

  PasswordPepperKmsKeyArn:
    Type: String
    Description: "ARN of the CMK protecting the password pepper"

  DynamoDbKmsKeyArn:
    Type: String
    Description: "ARN of the CMK for DynamoDB encryption at rest"

  AuditLogKmsKeyArn:
    Type: String
    Description: "ARN of the CMK protecting the S3 compliance vault"

Conditions:
  IsProd: !Equals [!Ref Environment, "prod"]
  DeployCloudFront: !And [!Condition IsProd, !Equals [!Ref EnableCloudFront, "true"]]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        DYNAMODB_TABLE_NAME: !Ref FintechTransactionsTable
        CACHE_TABLE_NAME: !Ref FintechCacheTable
        USERS_TABLE_NAME: !Ref FintechUsersTable
        SQS_QUEUE_URL: !Ref FintechTransactionQueue
        FUNCTION_NAME: !Sub fintech-api-${Environment}
        AUDIT_LOG_BUCKET_NAME: !Ref FintechAuditLogBucket
        PROD_CUSTOM_DOMAIN: "https://fintech.raynercodes.dev"
        ROOT_PATH: !If [IsProd, "", !Sub "/${Environment}"]

Resources:

  # -------------------------------------------------------
  # CloudWatch Log Groups — explicit retention, 14 days
  # Without these, Lambda auto-creates log groups with NO
  # expiration — every debug print lives forever, silently
  # accumulating storage cost. This caps it.
  # -------------------------------------------------------
  FintechApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/fintech-api-${Environment}
      RetentionInDays: 14

  FintechAuthorizerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/fintech-authorizer-${Environment}
      RetentionInDays: 14

  FintechWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/fintech-worker-${Environment}
      RetentionInDays: 14

  FintechValidateDeploymentLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/fintech-validate-deployment-${Environment}
      RetentionInDays: 14

  FintechValidateProductionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/fintech-validate-production-${Environment}
      RetentionInDays: 14

  FintechCleanupLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/fintech-cleanup-${Environment}
      RetentionInDays: 14

  FintechBackupLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/fintech-backup-${Environment}
      RetentionInDays: 14

  # -------------------------------------------------------
  # API Gateway Regional Custom Domain — independent of
  # CloudFront entirely. Gives us a permanent, stable domain
  # that never changes even if the underlying API Gateway
  # physical ID gets replaced during future stack recreations.
  # -------------------------------------------------------
  FintechRegionalDomainName:
    Type: AWS::ApiGateway::DomainName
    Condition: IsProd
    Properties:
      DomainName: fintech.raynercodes.dev
      RegionalCertificateArn: !Ref RegionalCustomDomainCertArn
      EndpointConfiguration:
        Types:
          - REGIONAL
      SecurityPolicy: TLS_1_2

  FintechRegionalDomainMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Condition: IsProd
    Properties:
      DomainName: !Ref FintechRegionalDomainName
      RestApiId: !Ref FintechApi
      Stage: !Ref Environment

  # -------------------------------------------------------
  # SQS FIFO Dead Letter Queue
  # -------------------------------------------------------
  FintechTransactionDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub fintech-transactions-dlq-${Environment}.fifo
      FifoQueue: true
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: Project
          Value: fintech-serverless
        - Key: Environment
          Value: !Ref Environment

  # -------------------------------------------------------
  # SQS FIFO Queue
  # -------------------------------------------------------
  FintechTransactionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub fintech-transactions-${Environment}.fifo
      FifoQueue: true
      ContentBasedDeduplication: false
      VisibilityTimeout: 60
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt FintechTransactionDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Project
          Value: fintech-serverless
        - Key: Environment
          Value: !Ref Environment

  # -------------------------------------------------------
  # Lambda Layers
  # -------------------------------------------------------
  FintechDependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub fintech-dependencies-${Environment}
      Description: Shared dependencies for fintech Lambda functions
      ContentUri: ../package/
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Delete

  # -------------------------------------------------------
  # IAM Role — shared across Lambda functions
  # -------------------------------------------------------
  FintechLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub fintech-lambda-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: FintechLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # DynamoDB — scoped to fintech tables only
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:DescribeTable
                  - dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt FintechTransactionsTable.Arn
                  - !Sub ${FintechTransactionsTable.Arn}/index/*
                  - !GetAtt FintechCacheTable.Arn
                  - !GetAtt FintechUsersTable.Arn
              # SQS — scoped to fintech queue only
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt FintechTransactionQueue.Arn
              # Secrets Manager — scoped to fintech secrets only
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource: !Sub arn:aws:secretsmanager:us-east-1:${AWS::AccountId}:secret:/fintech/*
              # KMS — for decrypting secrets
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: '*'
              # SSM — read-only, scoped to ONLY this environment's own
              # version parameter. Deliberately narrow so a future RDS
              # migration (adding db credentials to SSM/Secrets Manager)
              # never accidentally falls under this same grant.
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub arn:aws:ssm:us-east-1:${AWS::AccountId}:parameter/fintech/${Environment}/app-version
              # CodeDeploy — for lifecycle hooks
              - Effect: Allow
                Action:
                  - codedeploy:PutLifecycleEventHookExecutionStatus
                Resource: '*'
              # CloudWatch — for AfterAllowTraffic hook metrics
              - Effect: Allow
                Action:
                  - cloudwatch:GetMetricStatistics
                Resource: '*'
              # S3 Audit Log — write-only. GetObject included only if
              # you want an endpoint to read records back later.
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub ${FintechAuditLogBucket.Arn}/*
              # Explicit DENY — even if a future policy change accidentally
              # grants delete permissions somewhere else, an explicit Deny
              # ALWAYS wins over any Allow in IAM evaluation. This is a
              # second, independent layer on top of Object Lock itself.
              - Effect: Deny
                Action:
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:PutLifecycleConfiguration
                Resource:
                  - !GetAtt FintechAuditLogBucket.Arn
                  - !Sub ${FintechAuditLogBucket.Arn}/*

  # -------------------------------------------------------
  # EventBridge IAM Role — for scheduled tasks (e.g., cleanup, maintenance)
  # -------------------------------------------------------
  FintechScheduledJobsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub fintech-scheduled-jobs-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ScheduledJobsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Cleanup job — Scan + targeted UpdateItem only, no
              # Query/PutItem/DeleteItem needed
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:UpdateItem
                Resource: !GetAtt FintechTransactionsTable.Arn
              # Backup job — on-demand backup lifecycle only
              - Effect: Allow
                Action:
                  - dynamodb:CreateBackup
                  - dynamodb:ListBackups
                  - dynamodb:DeleteBackup
                  - dynamodb:DescribeBackup
                Resource:
                  - !GetAtt FintechTransactionsTable.Arn
                  - !GetAtt FintechUsersTable.Arn
                  - !Sub "${FintechTransactionsTable.Arn}/backup/*"
                  - !Sub "${FintechUsersTable.Arn}/backup/*"
              # Audit vault write — cleanup job needs this, backup job doesn't
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub ${FintechAuditLogBucket.Arn}/*
              - Effect: Allow
                Action:
                  - kms:GenerateDataKey
                Resource: !Ref AuditLogKmsKeyArn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !Ref DynamoDbKmsKeyArn


  # -------------------------------------------------------
  # EventBridge CRON Jobs — scheduled cleanup job
  # -------------------------------------------------------
  FintechCleanupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub fintech-cleanup-${Environment}
      Description: "Daily scan for stale pending loans — flags for human review, never deletes"
      CodeUri: ../package/
      Handler: src.scheduled.cleanup_handler.handler
      Role: !GetAtt FintechScheduledJobsRole.Arn
      Timeout: 60
      Events:
        DailyCleanup:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)
            Description: "Runs the stale-pending-transaction cleanup daily"

  FintechBackupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub fintech-backup-${Environment}
      Description: "Daily on-demand DynamoDB backup with 35-day rolling retention"
      CodeUri: ../package/
      Handler: src.scheduled.backup_handler.handler
      Role: !GetAtt FintechScheduledJobsRole.Arn
      Timeout: 60
      Events:
        DailyBackup:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)
            Description: "Runs the DynamoDB backup job daily"

  # -------------------------------------------------------
  # CodeDeploy Service Role
  # -------------------------------------------------------
  FintechCodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub fintech-codedeploy-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSCodeDeployRoleForLambda
      Policies:
        - PolicyName: CodeDeployLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:UpdateAlias
                  - lambda:ListVersionsByFunction
                  - lambda:InvokeFunction
                  - lambda:GetAlias
                  - lambda:UpdateFunctionCode
                  - lambda:PublishVersion
                  - codedeploy:*
                  - cloudwatch:DescribeAlarms
                  - sns:Publish
                  - iam:PassRole
                Resource: '*'

  # -------------------------------------------------------
  # Lambda — API Function
  # -------------------------------------------------------
  FintechApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub fintech-api-${Environment}
      Description: "FastAPI + Mangum handler for loan application endpoints"
      CodeUri: ../package/
      Handler: src.api.main.handler
      Role: !GetAtt FintechLambdaRole.Arn
      Tracing: Active
      AutoPublishAlias: !Ref Environment
      DeploymentPreference:
        Type: Canary10Percent15Minutes #AllAtOnce
        Role: !GetAtt FintechCodeDeployServiceRole.Arn
        Hooks:
          PreTraffic: !Ref FintechValidateDeploymentFunction
          PostTraffic: !Ref FintechValidateProductionFunction
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref FintechApi
            Path: /{proxy+}
            Method: ANY
        HealthEvent:
          Type: Api
          Properties:
            RestApiId: !Ref FintechApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE
        DocsEvent:
          Type: Api
          Properties:
            RestApiId: !Ref FintechApi
            Path: /docs
            Method: GET
            Auth:
              Authorizer: NONE
        OpenApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref FintechApi
            Path: /openapi.json
            Method: GET
            Auth:
              Authorizer: NONE
        DocsStaticEvent:
          Type: Api
          Properties:
            RestApiId: !Ref FintechApi
            Path: /docs/{asset}
            Method: GET
            Auth:
              Authorizer: NONE
        AuthLoginEvent:
          Type: Api
          Properties:
            RestApiId: !Ref FintechApi
            Path: /auth/login
            Method: POST
            Auth:
              Authorizer: NONE
        AuthRegisterEvent:
          Type: Api
          Properties:
            RestApiId: !Ref FintechApi
            Path: /auth/register
            Method: POST
            Auth:
              Authorizer: NONE
        AuthDemoEvent:
          Type: Api
          Properties:
            RestApiId: !Ref FintechApi
            Path: /auth/demo
            Method: POST
            Auth:
              Authorizer: NONE

  # -------------------------------------------------------
  # Lambda — Authorizer Function
  # -------------------------------------------------------
  FintechAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub fintech-authorizer-${Environment}
      Description: "Lambda Authorizer — JWT validation before main function invokes"
      CodeUri: ../package/
      Handler: src.authorizer.handler.handler
      Role: !GetAtt FintechLambdaRole.Arn
      Tracing: Active

  # -------------------------------------------------------
  # Lambda — SQS Worker Function
  # -------------------------------------------------------
  FintechWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub fintech-worker-${Environment}
      Description: "SQS FIFO worker — processes loan transactions asynchronously"
      CodeUri: ../package/
      Handler: src.worker.handler.handler
      Role: !GetAtt FintechLambdaRole.Arn
      Tracing: Active
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt FintechTransactionQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

  # -------------------------------------------------------
  # Lambda — BeforeAllowTraffic Hook
  # -------------------------------------------------------
  FintechValidateDeploymentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub fintech-validate-deployment-${Environment}
      Description: "CodeDeploy BeforeAllowTraffic hook — pre-deployment sanity check"
      CodeUri: ../package/
      Handler: src.hooks.validate_deployment.handler
      Role: !GetAtt FintechLambdaRole.Arn
      Tracing: Active

  # -------------------------------------------------------
  # Lambda — AfterAllowTraffic Hook
  # -------------------------------------------------------
  FintechValidateProductionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub fintech-validate-production-${Environment}
      Description: "CodeDeploy AfterAllowTraffic hook — canary window error monitoring"
      CodeUri: ../package/
      Handler: src.hooks.validate_production.handler
      Role: !GetAtt FintechLambdaRole.Arn
      Tracing: Active

  # -------------------------------------------------------
  # Lambda Permission — allow CodeDeploy to invoke hooks
  # -------------------------------------------------------
  ValidateDeploymentPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt FintechValidateDeploymentFunction.Arn
      Action: lambda:InvokeFunction
      Principal: codedeploy.amazonaws.com
      SourceArn: !Sub arn:aws:codedeploy:us-east-1:${AWS::AccountId}:deploymentgroup:*

  ValidateProductionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt FintechValidateProductionFunction.Arn
      Action: lambda:InvokeFunction
      Principal: codedeploy.amazonaws.com
      SourceArn: !Sub arn:aws:codedeploy:us-east-1:${AWS::AccountId}:deploymentgroup:*

  # -------------------------------------------------------
  # API Gateway
  # -------------------------------------------------------
  FintechApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub fintech-api-${Environment}
      StageName: !Ref Environment
      TracingEnabled: true
      Auth:
        DefaultAuthorizer: FintechAuthorizer
        Authorizers:
          FintechAuthorizer:
            FunctionArn: !GetAtt FintechAuthorizerFunction.Arn
            Identity:
              Header: Authorization
        ResourcePolicy:
          CustomStatements:
            - Effect: Allow
              Principal: '*'
              Action: execute-api:Invoke
              Resource:
                - !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*/${Environment}/* 
                #- !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*/${Environment}/GET/health
                #- !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*/${Environment}/GET/docs
                #- !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*/${Environment}/GET/openapi.json
                #- !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*/*/GET/openapi.json
                #- !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*/${Environment}/GET/docs~1swagger-ui.css
                #- !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*/${Environment}/GET/docs~1swagger-ui-bundle.js
                #- !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*/${Environment}/GET/docs~1favicon.png
                #- !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*/${Environment}/POST/auth/login
                #- !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*/${Environment}/POST/auth/register
                #- !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*/${Environment}/POST/auth/demo
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingBurstLimit: 1000 #100
          ThrottlingRateLimit: 500 #50
          LoggingLevel: INFO
          DataTraceEnabled: false
          MetricsEnabled: true

  # -------------------------------------------------------
  # DynamoDB — Main Transactions Table
  # -------------------------------------------------------
  FintechTransactionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub fintech-transactions-${Environment}
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref DynamoDbKmsKeyArn
      AttributeDefinitions:
        - AttributeName: account_id
          AttributeType: S
        - AttributeName: timestamp_transaction_id
          AttributeType: S
        - AttributeName: transaction_id
          AttributeType: S
        - AttributeName: customer_id
          AttributeType: S
      KeySchema:
        - AttributeName: account_id
          KeyType: HASH
        - AttributeName: timestamp_transaction_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: transaction-id-index
          KeySchema:
            - AttributeName: transaction_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: customer-id-index
          KeySchema:
            - AttributeName: customer_id
              KeyType: HASH
            - AttributeName: timestamp_transaction_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      Tags:
        - Key: Project
          Value: fintech-serverless
        - Key: Environment
          Value: !Ref Environment

  # -------------------------------------------------------
  # DynamoDB — Users Table
  # -------------------------------------------------------
  FintechUsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub fintech-users-${Environment}
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref DynamoDbKmsKeyArn
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      Tags:
        - Key: Project
          Value: fintech-serverless
        - Key: Environment
          Value: !Ref Environment

  # -------------------------------------------------------
  # DynamoDB — WebSocket Connection Tracking
  # Supports two lookup directions: $disconnect only ever
  # has connection_id, while the Step Functions notify step
  # only ever has loan_id — same two-directional-lookup shape
  # as the main Transactions table's account_id/transaction_id
  # design, solved the same way (GSI).
  # -------------------------------------------------------
  FintechWebSocketConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub fintech-websocket-connections-${Environment}
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref DynamoDbKmsKeyArn
      AttributeDefinitions:
        - AttributeName: connection_id
          AttributeType: S
        - AttributeName: loan_id
          AttributeType: S
      KeySchema:
        - AttributeName: connection_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: loan-id-index
          KeySchema:
            - AttributeName: loan_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      Tags:
        - Key: Project
          Value: fintech-serverless
        - Key: Environment
          Value: !Ref Environment

  # -------------------------------------------------------
  # DynamoDB — Cache Table
  # -------------------------------------------------------
  FintechCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub fintech-cache-${Environment}
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref DynamoDbKmsKeyArn
      AttributeDefinitions:
        - AttributeName: cache_key
          AttributeType: S
      KeySchema:
        - AttributeName: cache_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      Tags:
        - Key: Project
          Value: fintech-serverless
        - Key: Environment
          Value: !Ref Environment

  # -------------------------------------------------------
  # S3 — Audit Log Bucket
  # -------------------------------------------------------
  FintechAuditLogBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub fintech-audit-log-${AWS::AccountId}-${Environment}
      VersioningConfiguration:
        Status: Enabled
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: COMPLIANCE
            Years: 3
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToGlacierFlexibleRetrieval
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER
                TransitionInDays: 60
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref AuditLogKmsKeyArn
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: fintech-serverless
        - Key: Environment
          Value: !Ref Environment

  # Explicit protection layer, on top of Object Lock itself —
  # even a future policy mistake elsewhere can't override this Deny
  AuditLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FintechAuditLogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyDeleteEver
            Effect: Deny
            Principal: '*'
            Action:
              - s3:DeleteObject
              - s3:DeleteObjectVersion
            Resource: !Sub ${FintechAuditLogBucket.Arn}/*   # object-level — needs /*
          - Sid: DenyLifecycleChangeEver
            Effect: Deny
            Principal: '*'
            Action:
              - s3:PutLifecycleConfiguration
            Resource: !GetAtt FintechAuditLogBucket.Arn      # bucket-level — no /*

  # -------------------------------------------------------
  # CloudFront Distribution — fintech.raynercodes.dev
  # Regional API Gateway as custom origin. Only exists in
  # prod — dev/staging hit the raw execute-api URL directly,
  # no CDN needed for internal testing stages.
  # -------------------------------------------------------
  FintechCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: DeployCloudFront
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "fintech-serverless-${Environment}"
        Aliases:
          - fintech.raynercodes.dev
        ViewerCertificate:
          AcmCertificateArn: !Ref FintechCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: FintechApiGatewayOrigin
            # Regional API Gateway's own domain — NOT the CloudFront
            # domain, this is what CloudFront forwards requests TO
            DomainName: !Sub "${FintechApi}.execute-api.${AWS::Region}.amazonaws.com"
            OriginPath: !Sub "/${Environment}"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: FintechApiGatewayOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - PATCH
            - POST
            - DELETE
          CachedMethods:
            - GET
            - HEAD
          # This is an API, not static content — caching responses
          # would serve stale loan data. ForwardedValues disabled
          # caching entirely by forwarding everything through.
          ForwardedValues:
            QueryString: true
            Headers:
              - Authorization
              - Content-Type
            Cookies:
              Forward: none
          MinTTL: 0
          DefaultTTL: 0
          MaxTTL: 0
  
  # -------------------------------------------------------
  # ACM Certificate — fintech.raynercodes.dev
  # CloudFront requires certs in us-east-1 specifically,
  # regardless of where the rest of the stack lives — this
  # happens to already match our region, so no cross-region
  # nested stack needed.
  # -------------------------------------------------------
  FintechCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: DeployCloudFront
    DeletionPolicy: Retain
    Properties:
      DomainName: fintech.raynercodes.dev
      ValidationMethod: DNS
      Tags:
        - Key: Project
          Value: fintech-serverless

  # -------------------------------------------------------
  # CloudWatch — Billing Alarm
  # -------------------------------------------------------
  BillingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub fintech-billing-alarm-${Environment}
      AlarmDescription: Alert when AWS charges exceed $10
      MetricName: EstimatedCharges
      Namespace: AWS/Billing
      Statistic: Maximum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: Currency
          Value: USD

Outputs:
  ApiUrl:
    Value: !Sub https://${FintechApi}.execute-api.us-east-1.amazonaws.com/${Environment}
    Export:
      Name: !Sub fintech-api-url-${Environment}

  RegionalDomainTarget:
    Condition: IsProd
    Value: !GetAtt FintechRegionalDomainName.RegionalDomainName
    Export:
      Name: !Sub fintech-regional-domain-target-${Environment}

  ApiId:
    Value: !Ref FintechApi
    Export:
      Name: !Sub fintech-api-id-${Environment}

  TransactionsTableName:
    Value: !Ref FintechTransactionsTable
    Export:
      Name: !Sub fintech-transactions-table-${Environment}

  TransactionsTableArn:
    Value: !GetAtt FintechTransactionsTable.Arn
    Export:
      Name: !Sub fintech-transactions-table-arn-${Environment}

  WebSocketConnectionsTableName:
    Value: !Ref FintechWebSocketConnectionsTable
    Export:
      Name: !Sub fintech-websocket-connections-table-${Environment}

  CacheTableName:
    Value: !Ref FintechCacheTable
    Export:
      Name: !Sub fintech-cache-table-${Environment}

  WorkerFunctionArn:
    Value: !GetAtt FintechWorkerFunction.Arn
    Export:
      Name: !Sub fintech-worker-arn-${Environment}

  QueueUrl:
    Value: !Ref FintechTransactionQueue
    Export:
      Name: !Sub fintech-queue-url-${Environment}

  DLQUrl:
    Value: !Ref FintechTransactionDLQ
    Export:
      Name: !Sub fintech-dlq-url-${Environment}

  DLQArn:
    Value: !GetAtt FintechTransactionDLQ.Arn
    Export:
      Name: !Sub fintech-dlq-arn-${Environment}

  CertificateArn:
    Condition: DeployCloudFront
    Value: !Ref FintechCertificate
    Export:
      Name: !Sub fintech-certificate-arn-${Environment}

  CloudFrontDomainName:
    Condition: DeployCloudFront
    Value: !GetAtt FintechCloudFrontDistribution.DomainName
    Export:
      Name: !Sub fintech-cloudfront-domain-${Environment}