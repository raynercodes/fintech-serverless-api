name: CI Pipeline

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          DYNAMODB_TABLE_NAME: fintech-transactions-test
          CACHE_TABLE_NAME: fintech-cache-test
          SQS_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/123456789/fintech-test.fifo
        run: |
          pytest tests/ -v --tb=short

      - name: Package Lambda function
        if: success()
        run: |
          pip install -r requirements.txt --target ./package
          cp -r src ./package/
          cd package
          zip -r ../functions.zip .
          cd ..
          echo "Package size: $(du -sh functions.zip)"

      - name: Upload artifact for CodePipeline
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: functions-zip
          path: functions.zip
          retention-days: 5
