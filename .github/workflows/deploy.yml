name: CI/CD Pipeline

on:
  push:
    branches: [dev]

permissions:
  id-token: write   # required for OIDC — lets this workflow request an AWS credential
  contents: read

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      app_version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute short version string
        id: version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=1.0.${{ github.run_number }}+${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "{\"version\": \"${VERSION}\"}" > src/api/version.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install aws-sam-cli
      - run: cp -r src ./package/
      - run: sam build --template infrastructure/template.yaml --no-cached
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::181250799646:role/github-actions-fintech-deploy
          aws-region: us-east-1
      - run: sam package --s3-bucket fintech-serverless-artifacts-dev --output-template-file packaged-template.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: packaged-template
          path: packaged-template.yaml

  # ============================================================
  # PLAN — runs immediately, NO environment gate, NO approval
  # needed. Its entire job is to create a changeset and print
  # exactly what it would do, so a human can read the real diff
  # before anyone clicks Approve on anything.
  # ============================================================
  plan-staging:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      changeset_type: ${{ steps.changeset-type.outputs.type }}
      has_changes: ${{ steps.create-changeset.outputs.has_changes }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packaged-template
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::181250799646:role/github-actions-fintech-deploy
          aws-region: us-east-1
      - name: Determine changeset type (handles deleted/stub stacks correctly)
        id: changeset-type
        run: |
          STACK_STATUS=$(aws cloudformation describe-stacks --stack-name fintech-serverless-staging --region us-east-1 --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "NOT_FOUND")
          if [ "$STACK_STATUS" == "NOT_FOUND" ] || [ "$STACK_STATUS" == "DELETE_COMPLETE" ] || [ "$STACK_STATUS" == "REVIEW_IN_PROGRESS" ] || [ "$STACK_STATUS" == "ROLLBACK_COMPLETE" ]; then
            echo "type=CREATE" >> "$GITHUB_OUTPUT"
          else
            echo "type=UPDATE" >> "$GITHUB_OUTPUT"
          fi
      - name: Create changeset (does NOT execute anything yet)
        id: create-changeset
        run: |
          aws cloudformation create-change-set \
            --stack-name fintech-serverless-staging \
            --change-set-name gha-${{ github.run_id }} \
            --change-set-type ${{ steps.changeset-type.outputs.type }} \
            --template-body file://packaged-template.yaml \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --parameters \
              ParameterKey=Environment,ParameterValue=staging \
              ParameterKey=EnableCloudFront,ParameterValue=false \
              ParameterKey=JwtKmsKeyArn,ParameterValue=arn:aws:kms:us-east-1:181250799646:key/2ebdd663-9bdd-41fb-895b-dad1edbb0e19 \
              ParameterKey=EncryptionKmsKeyArn,ParameterValue=arn:aws:kms:us-east-1:181250799646:key/3080a2c0-34b6-4760-9754-e88d2047cc37 \
              ParameterKey=PasswordPepperKmsKeyArn,ParameterValue=arn:aws:kms:us-east-1:181250799646:key/a95af96e-c57a-4983-8b8f-eb3defe179a7 \
              ParameterKey=DynamoDbKmsKeyArn,ParameterValue=arn:aws:kms:us-east-1:181250799646:key/898be084-35e4-4d59-af4f-06e42aec6ee3 \
              ParameterKey=AuditLogKmsKeyArn,ParameterValue=arn:aws:kms:us-east-1:181250799646:key/bcd6a6d1-ff83-47ab-a893-2f5384626601 \
            --region us-east-1
          # So we poll manually and inspect the REASON before deciding.
          aws cloudformation wait change-set-create-complete \
            --stack-name fintech-serverless-staging \
            --change-set-name gha-${{ github.run_id }} \
            --region us-east-1 || true

          STATUS=$(aws cloudformation describe-change-set --stack-name fintech-serverless-staging --change-set-name gha-${{ github.run_id }} --region us-east-1 --query "Status" --output text)
          REASON=$(aws cloudformation describe-change-set --stack-name fintech-serverless-staging --change-set-name gha-${{ github.run_id }} --region us-east-1 --query "StatusReason" --output text)

          if [ "$STATUS" == "FAILED" ]; then
            if [[ "$REASON" == *"didn't contain changes"* ]] || [[ "$REASON" == *"No updates are to be performed"* ]]; then
              echo "No changes detected — staging already matches this template. Nothing to deploy."
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              aws cloudformation delete-change-set --stack-name fintech-serverless-staging --change-set-name gha-${{ github.run_id }} --region us-east-1
            else
              echo "Changeset genuinely failed: $REASON"
              exit 1
            fi
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Print the actual plan — THIS is what you review before approving
        if: steps.create-changeset.outputs.has_changes == 'true'
        run: |
          aws cloudformation describe-change-set \
            --stack-name fintech-serverless-staging \
            --change-set-name gha-${{ github.run_id }} \
            --region us-east-1 \
            --query "Changes[].{Action:ResourceChange.Action,Resource:ResourceChange.LogicalResourceId,Type:ResourceChange.ResourceType,Replacement:ResourceChange.Replacement}" \
            --output table
      - name: Clean up failed changeset (only runs if a step above failed)
        if: failure()
        run: |
          aws cloudformation delete-change-set \
            --stack-name fintech-serverless-staging \
            --change-set-name gha-${{ github.run_id }} \
            --region us-east-1 || true

  # ============================================================
  # APPLY — THIS is the one gated by your GitHub Environment
  # approval. By the time you click Approve, the plan above has
  # ALREADY run and its output is sitting right there in the logs
  # for you to read first.
  # ============================================================
  deploy-staging:
    runs-on: ubuntu-latest
    needs: plan-staging
    if: success()
    environment: staging   # <- this is what makes GitHub pause for approval
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::181250799646:role/github-actions-fintech-deploy
          aws-region: us-east-1
      - name: Execute changeset (only if there are real changes to apply)
        if: needs.plan-staging.outputs.has_changes == 'true'
        run: |
          EXEC_STATUS=$(aws cloudformation describe-change-set \
            --stack-name fintech-serverless-staging \
            --change-set-name gha-${{ github.run_id }} \
            --region us-east-1 \
            --query "ExecutionStatus" --output text)

          if [ "$EXEC_STATUS" == "EXECUTE_COMPLETE" ]; then
            echo "This changeset already executed successfully — likely a duplicate job dispatch during GitHub's recent instability. Staging is already up to date, nothing more to do."
          else
            aws cloudformation execute-change-set \
              --stack-name fintech-serverless-staging \
              --change-set-name gha-${{ github.run_id }} \
              --region us-east-1

            if [ "${{ needs.plan-staging.outputs.changeset_type }}" == "CREATE" ]; then
              aws cloudformation wait stack-create-complete --stack-name fintech-serverless-staging --region us-east-1
            else
              aws cloudformation wait stack-update-complete --stack-name fintech-serverless-staging --region us-east-1
            fi
          fi
      - name: No changes to deploy
        if: needs.plan-staging.outputs.has_changes != 'true'
        run: echo "Staging already matches this template — nothing to deploy this run."
      - name: Print live stack URL
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name fintech-serverless-staging --region us-east-1 --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          echo "Staging API is live at: $URL/health"
          echo "Docs: $URL/docs"

  # ============================================================
  # PLAN and APPLY for PRODUCTION — same as above, but gated by
  # the production environment approval. The plan job runs first,
  # and the production changeset executes only after you click Approve.
  # ============================================================
  plan-prod:
    runs-on: ubuntu-latest
    needs: deploy-staging
    outputs:
      changeset_type: ${{ steps.changeset-type.outputs.type }}
      has_changes: ${{ steps.create-changeset.outputs.has_changes }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packaged-template
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::181250799646:role/github-actions-fintech-deploy
          aws-region: us-east-1
      - name: Determine changeset type (handles deleted/stub stacks correctly)
        id: changeset-type
        run: |
          STACK_STATUS=$(aws cloudformation describe-stacks --stack-name fintech-serverless-prod --region us-east-1 --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "NOT_FOUND")
          if [ "$STACK_STATUS" == "NOT_FOUND" ] || [ "$STACK_STATUS" == "DELETE_COMPLETE" ] || [ "$STACK_STATUS" == "REVIEW_IN_PROGRESS" ] || [ "$STACK_STATUS" == "ROLLBACK_COMPLETE" ]; then
            echo "type=CREATE" >> "$GITHUB_OUTPUT"
          else
            echo "type=UPDATE" >> "$GITHUB_OUTPUT"
          fi
      - name: Create changeset (does NOT execute anything yet)
        id: create-changeset
        run: |
          aws cloudformation create-change-set \
            --stack-name fintech-serverless-prod \
            --change-set-name gha-${{ github.run_id }} \
            --change-set-type ${{ steps.changeset-type.outputs.type }} \
            --template-body file://packaged-template.yaml \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --parameters \
              ParameterKey=Environment,ParameterValue=prod \
              ParameterKey=EnableCloudFront,ParameterValue=false \
              ParameterKey=RegionalCustomDomainCertArn,ParameterValue=arn:aws:acm:us-east-1:181250799646:certificate/dbbc721d-35e7-4b6f-8ee2-6054db07346b \
              ParameterKey=JwtKmsKeyArn,ParameterValue=arn:aws:kms:us-east-1:181250799646:key/2ebdd663-9bdd-41fb-895b-dad1edbb0e19 \
              ParameterKey=EncryptionKmsKeyArn,ParameterValue=arn:aws:kms:us-east-1:181250799646:key/3080a2c0-34b6-4760-9754-e88d2047cc37 \
              ParameterKey=PasswordPepperKmsKeyArn,ParameterValue=arn:aws:kms:us-east-1:181250799646:key/a95af96e-c57a-4983-8b8f-eb3defe179a7 \
              ParameterKey=DynamoDbKmsKeyArn,ParameterValue=arn:aws:kms:us-east-1:181250799646:key/898be084-35e4-4d59-af4f-06e42aec6ee3 \
              ParameterKey=AuditLogKmsKeyArn,ParameterValue=arn:aws:kms:us-east-1:181250799646:key/bcd6a6d1-ff83-47ab-a893-2f5384626601 \
            --region us-east-1
          # So we poll manually and inspect the REASON before deciding.
          aws cloudformation wait change-set-create-complete \
            --stack-name fintech-serverless-prod \
            --change-set-name gha-${{ github.run_id }} \
            --region us-east-1 || true

          STATUS=$(aws cloudformation describe-change-set --stack-name fintech-serverless-prod --change-set-name gha-${{ github.run_id }} --region us-east-1 --query "Status" --output text)
          REASON=$(aws cloudformation describe-change-set --stack-name fintech-serverless-prod --change-set-name gha-${{ github.run_id }} --region us-east-1 --query "StatusReason" --output text)

          if [ "$STATUS" == "FAILED" ]; then
            if [[ "$REASON" == *"didn't contain changes"* ]] || [[ "$REASON" == *"No updates are to be performed"* ]]; then
              echo "No changes detected — production already matches this template. Nothing to deploy."
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              aws cloudformation delete-change-set --stack-name fintech-serverless-prod --change-set-name gha-${{ github.run_id }} --region us-east-1
            else
              echo "Changeset genuinely failed: $REASON"
              exit 1
            fi
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Print the actual plan for PRODUCTION
        if: steps.create-changeset.outputs.has_changes == 'true'
        run: |
          aws cloudformation describe-change-set \
            --stack-name fintech-serverless-prod \
            --change-set-name gha-${{ github.run_id }} \
            --region us-east-1 \
            --query "Changes[].{Action:ResourceChange.Action,Resource:ResourceChange.LogicalResourceId,Type:ResourceChange.ResourceType,Replacement:ResourceChange.Replacement}" \
            --output table
      - name: Clean up failed changeset (only runs if a step above failed)
        if: failure()
        run: |
          aws cloudformation delete-change-set \
            --stack-name fintech-serverless-prod \
            --change-set-name gha-${{ github.run_id }} \
            --region us-east-1 || true

  # ============================================================
  # APPLY for PRODUCTION — gated by the production environment
  # approval. By the time you click Approve, the plan above has
  # ALREADY run and its output is sitting right there in the logs
  # pre-verified in the plan-prod CD
  # ============================================================
  deploy-prod:
    runs-on: ubuntu-latest
    needs: plan-prod
    if: success()
    environment: production
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::181250799646:role/github-actions-fintech-deploy
          aws-region: us-east-1
      - name: Execute changeset (only if there are real changes to apply)
        if: needs.plan-prod.outputs.has_changes == 'true'
        run: |
          EXEC_STATUS=$(aws cloudformation describe-change-set \
            --stack-name fintech-serverless-prod \
            --change-set-name gha-${{ github.run_id }} \
            --region us-east-1 \
            --query "ExecutionStatus" --output text)

          if [ "$EXEC_STATUS" == "EXECUTE_COMPLETE" ]; then
            echo "This changeset already executed successfully — likely a duplicate job dispatch during GitHub's recent instability. Production is already up to date, nothing more to do."
          else
            aws cloudformation execute-change-set \
              --stack-name fintech-serverless-prod \
              --change-set-name gha-${{ github.run_id }} \
              --region us-east-1

            if [ "${{ needs.plan-prod.outputs.changeset_type }}" == "CREATE" ]; then
              aws cloudformation wait stack-create-complete --stack-name fintech-serverless-prod --region us-east-1
            else
              aws cloudformation wait stack-update-complete --stack-name fintech-serverless-prod --region us-east-1
            fi
          fi
      - name: No changes to deploy
        if: needs.plan-prod.outputs.has_changes != 'true'
        run: echo "Production already matches this template — nothing to deploy this run."
      - name: Print live stack URL
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name fintech-serverless-prod --region us-east-1 --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          echo "Production API is live at: $URL/health"
          echo "Docs: $URL/docs"
